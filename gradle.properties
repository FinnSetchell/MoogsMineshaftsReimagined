org.gradle.jvmargs=-Xmx2G
modName=MoogsMineshaftsReimagined
minecraftVersion=1.21
modVersion=1.0.4
modId=mmr
modDescription=Reimagined mineshafts made with vanilla blocks and entities - explore overhauled mineshafts packed with new loot, enemies, and surprises across every biome!
modHomepage=https://github.com/FinnSetchell/MoogsMineshaftsReimagined
modSources=https://github.com/FinnSetchell/MoogsMineshaftsReimagined
modReleases=https://github.com/FinnSetchell/MoogsMineshaftsReimagined/releases
modIssues=https://github.com/FinnSetchell/MoogsMineshaftsReimagined/issues
modDiscord=
modKofi=https://ko-fi.com/finndog
modCurseforge=https://www.curseforge.com/minecraft/mc-mods/mmr-moogs-mineshafts-reimagined
modModrinth=https://modrinth.com/project/mmr-moogs-mineshafts-reimagined

# Structure Lib dependency range (forge mods.toml)
structureLibVersionRange=[3.0.0-alpha.1,)

# Publishing display customization
publishDisplayPrefix=MMR
publishDisplaySuffix=[UNIVERSAL]

# Publishing platform settings (new project - fill IDs once published)
modrinthProjectId=z25hqseO
curseforgeProjectId=1570795
curseforgeProjectSlug=mmr-moogs-mineshafts-reimagined
modrinthProjectSlug=moogs-mineshafts-reimagined

# Config datapack publishing (separate Modrinth/CurseForge projects)
datapackModrinthProjectId=
datapackCurseforgeProjectId=
publishMcStart=1.21
publishMcEnd=1.21.11
publishExtraMcVersions=26.1,26.1.1,26.1.2

# Set true to publish as an ALPHA: alpha release type on CurseForge/Modrinth, a [ALPHA]
# display marker, no config-datapack platform publish, posts to DISCORD_ALPHA_WEBHOOK_URL
# with no role ping, marks the GitHub release as a prerelease, and skips the version bump.
alphaBuild=false

# Discord webhook settings
discordAvatarUrl=https://media.forgecdn.net/avatars/thumbnails/1856/852/64/64/639166818425492570.png
discordEmbedColor=#41515a
# Small image in the corner of the publishMods release embed
discordThumbnailUrl=https://media.forgecdn.net/avatars/thumbnails/1856/852/64/64/639166818425492570.png
discordBannerUrl=https://pub-24a4e0e7ea8544a5b6f73c3a23512589.r2.dev/images/7ea9047bce0d4ce99c4860e352900619.png
