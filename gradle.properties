# Build inputs only. Everything the publish pipeline needs (project ids, MC windows,
# display names, Discord styling, dependencies) lives in .github/moogs-publish.yml on the
# repository's default branch. Keys are snake_case fleet-wide.
org.gradle.jvmargs=-Xmx2G

# Project
mod_id=mmr
mod_name=MoogsMineshaftsReimagined
mod_version=1.0.3
mod_description=Reimagined mineshafts made with vanilla blocks and entities - explore overhauled mineshafts packed with new loot, enemies, and surprises across every biome!

# Minecraft
minecraft_version=1.20

# Metadata links expanded into fabric.mod.json / quilt.mod.json / mods.toml / pack.mcmeta
mod_homepage=https://github.com/FinnSetchell/MoogsMineshaftsReimagined
mod_sources=https://github.com/FinnSetchell/MoogsMineshaftsReimagined
mod_releases=https://github.com/FinnSetchell/MoogsMineshaftsReimagined/releases
mod_issues=https://github.com/FinnSetchell/MoogsMineshaftsReimagined/issues
mod_discord=
mod_kofi=https://ko-fi.com/finndog
mod_curseforge=https://www.curseforge.com/minecraft/mc-mods/mmr-moogs-mineshafts-reimagined
mod_modrinth=https://modrinth.com/project/mmr-moogs-mineshafts-reimagined

# Structure Lib dependency range (forge/neoforge mods.toml)
structure_lib_version_range=[3.0.0-alpha.1,)
