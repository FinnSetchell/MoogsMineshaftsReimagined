name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish'
        type: string
        required: true
      releaseType:
        description: 'Release type: major | minor | alpha'
        type: string
        required: true
      releaseId:
        description: 'Worker KV release ID'
        type: string
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set alpha flag from releaseType
        shell: bash
        run: |
          if [ "${{ inputs.releaseType }}" = "alpha" ]; then
            sed -i 's|^alphaBuild=.*$|alphaBuild=true|' gradle.properties
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew build buildDatapack

      - name: Extract Changelog
        id: changelog
        shell: bash
        run: |
          VERSION=$(grep '^modVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
          BODY=$(python3 -c "
          import re, sys
          content = open('CHANGELOG.md').read()
          m = re.search(r'## \[' + re.escape(sys.argv[1]) + r'\] - \d{4}-\d{2}-\d{2}\r?\n(.*?)(?=\r?\n---|## \[|\Z)', content, re.DOTALL)
          print(m.group(1).strip() if m else '')
          " "$VERSION")
          printf "body<<DELIMITER\n%s\nDELIMITER\n" "$BODY" >> "$GITHUB_OUTPUT"

      - name: Build release title
        id: release_meta
        shell: bash
        env:
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          if [ "${{ inputs.releaseType }}" = "alpha" ]; then
            TITLE="${{ inputs.tag }} (Alpha)"
            BANNER="> 🧪 **Alpha test build.** Feedback welcome at https://github.com/${GITHUB_REPOSITORY}/issues."
            printf "title=%s\n" "$TITLE" >> "$GITHUB_OUTPUT"
            printf "body<<DELIMITER\n%s\n\n%s\nDELIMITER\n" "$BANNER" "$CHANGELOG_BODY" >> "$GITHUB_OUTPUT"
          else
            printf "title=%s\n" "${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            printf "body<<DELIMITER\n%s\nDELIMITER\n" "$CHANGELOG_BODY" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to CurseForge & Modrinth
        shell: bash
        run: |
          set -eo pipefail
          ./gradlew publishMods
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          DISCORD_WEBHOOK: "skip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: ${{ steps.release_meta.outputs.body }}
          prerelease: ${{ inputs.releaseType == 'alpha' }}
          files: |
            build/libs/*.jar
            build/datapack/*.zip
          fail_on_unmatched_files: false

      - name: Notify Worker
        if: always()
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.releaseId }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          SUCCESS="false"
          [ "$JOB_STATUS" = "success" ] && SUCCESS="true"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://moogsmods-bot.finndog176.workers.dev/published" \
            -H "X-API-Key: $WORKER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"releaseId\":\"$RELEASE_ID\",\"success\":$SUCCESS}")
          echo "Worker /published: $HTTP_CODE"

      - name: Prepare version bump
        if: inputs.releaseType != 'alpha'
        shell: bash
        run: |
          MC_VERSION=$(grep '^minecraftVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
          BRANCH="${MC_VERSION}-datapack"
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          OLD=$(grep '^modVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
          IFS='.' read -r -a P <<< "$OLD"
          NEW="${P[0]}.${P[1]}.$((P[2]+1))"
          sed -i "s|^modVersion=.*$|modVersion=${NEW}|" gradle.properties
          sed -i 's|^alphaBuild=.*$|alphaBuild=false|' gradle.properties
          echo "OLD_VERSION=${OLD}" >> "$GITHUB_ENV"
          echo "NEW_VERSION=${NEW}" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=${TODAY}" >> "$GITHUB_ENV"

      - name: Stub CHANGELOG for next version
        if: inputs.releaseType != 'alpha'
        shell: python3 {0}
        env:
          NEW_VERSION: ${{ env.NEW_VERSION }}
          RELEASE_DATE: ${{ env.RELEASE_DATE }}
        run: |
          import os, re
          from pathlib import Path
          new_v = os.environ['NEW_VERSION']
          today = os.environ['RELEASE_DATE']
          stub = (
              f"## [{new_v}] - {today}\n\n"
              "_Pending. Update this section before tagging._\n\n"
              "---\n\n"
          )
          p = Path('CHANGELOG.md')
          if p.exists():
              content = p.read_text(encoding='utf-8')
              match = re.search(r'# Changelog(?:\r?\n)+---(?:\r?\n)+', content)
              if match:
                  content = content[:match.end()] + stub + content[match.end():]
              else:
                  content = stub + content
              p.write_text(content, encoding='utf-8')
              print(f'Stubbed CHANGELOG.md with ## [{new_v}] - {today}')

      - name: Commit and push version bump
        if: inputs.releaseType != 'alpha'
        shell: bash
        run: |
          MC_VERSION=$(grep '^minecraftVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
          git add gradle.properties CHANGELOG.md
          git commit -m "Post-release: bump ${{ env.OLD_VERSION }} -> ${{ env.NEW_VERSION }} + stub CHANGELOG section"
          git push origin "${MC_VERSION}-datapack"
